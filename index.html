<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f9f6ef">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Wolkenrechnen">
    <meta name="description" content="Das kleine Einmaleins spielerisch üben und sicher werden – mit Wolkenrechnen.">
    <title>Wolkenrechnen · Dein 1×1-Trainer</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://joa.github.io/wolkenrechnen/">
    <meta property="og:title" content="Wolkenrechnen · Das kleine Einmaleins">
    <meta property="og:description" content="Das kleine Einmaleins spielerisch üben und sicher werden.">
    <meta property="og:image" content="https://joa.github.io/wolkenrechnen/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Wolkenrechnen: Das kleine Einmaleins spielerisch üben. Eine bunte Regenbogenwolke zeigt 7 mal 8 gleich 56.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wolkenrechnen · Das kleine Einmaleins">
    <meta name="twitter:description" content="Das kleine Einmaleins spielerisch üben und sicher werden.">
    <meta name="twitter:image" content="https://joa.github.io/wolkenrechnen/og-image.png">
    <link rel="icon" href="./cloud.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./src/styles.css">
    <script type="module" src="./src/app.mjs"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand"><span class="brand-icon" aria-hidden="true"><i></i></span>Wolkenrechnen</div>
        <span class="site-label">Das kleine Einmaleins</span>
      </div>
    </header>
    <main id="app" class="layout"></main>
    <template id="scene-template">
      <div class="scene">
        <div class="scene-art">
          <button class="theme-toggle" type="button" aria-label="Mond zeigen" aria-pressed="false">
            <span class="sun"></span><span class="moon"><i></i></span><span class="shooting-star">✦</span>
          </button>
          <span class="spark spark-one">✦</span>
          <span class="spark spark-two">✧</span>
          <span class="spark spark-three">✦</span>
          <span class="spark spark-four">✧</span>
          <div class="cloud cloud-left"><i></i><i></i></div>
          <div class="cloud cloud-right"><i></i><i></i></div>
          <div class="cloud cloud-low"><i></i><i></i></div>
          <div class="cloud cloud-edge"><i></i><i></i></div>
        </div>
        <div class="rainbow" aria-hidden="true"><span class="rainbow-arch"></span><span class="square-outline"></span></div>
        <div class="equation-cloud">
          <span class="equation"></span>
        </div>
        <div class="scene-caption"></div>
        <div class="confetti" aria-hidden="true"></div>
      </div>
    </template>
  </body>
</html>
